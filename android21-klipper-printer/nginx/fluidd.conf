# Fluidd static files + the reverse proxy to Moonraker (same-origin, so the browser needs no CORS and the

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Docker's embedded DNS; re-resolve so a restarted Moonraker (new IP) does not leave the proxy on a stale address
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;          # gcode uploads (moonraker max_upload_size is 1024)

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(printer|api|access|machine|server|websocket)(/|$) {
        set $moonraker http://moonraker:7125;
        proxy_pass $moonraker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }
}
