# Fluidd static files + the reverse proxy to Moonraker (same-origin, so the browser needs no CORS and the
# Umbrel app_proxy login in front covers everything). Replaces the image's default.conf.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;          # gcode uploads (moonraker max_upload_size is 1024)

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(printer|api|access|machine|server|websocket)(/|$) {
        proxy_pass http://moonraker:7125;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }
}
